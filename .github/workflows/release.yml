{
  "name": "Release candidate",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "source_sha": {
          "description": "Exact main dispatch SHA (40 lowercase hex)",
          "required": true,
          "type": "string"
        },
        "version": {
          "description": "Intended vMAJOR.MINOR.PATCH",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "candidate-${{ github.run_id }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "identity": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Trusted dispatch identity",
          "env": {
            "RELEASE_VERSION": "${{ inputs.version }}",
            "RELEASE_SHA": "${{ inputs.source_sha }}"
          },
          "run": "make candidate-identity"
        }
      ]
    },
    "ci": {
      "needs": [
        "identity"
      ],
      "uses": "./.github/workflows/ci.yml",
      "with": {
        "source_sha": "${{ inputs.source_sha }}"
      }
    },
    "build": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Pinned compiler",
          "uses": "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff",
          "with": {
            "go-version": "1.27.1",
            "cache": true
          }
        },
        {
          "name": "Pinned packaging prerequisites",
          "run": "make setup-sqlc setup-release release-check"
        },
        {
          "name": "Build candidate once",
          "env": {
            "RELEASE_VERSION": "${{ inputs.version }}",
            "RELEASE_SHA": "${{ inputs.source_sha }}"
          },
          "run": "make release-candidate RELEASE_OUTPUT=\"$RUNNER_TEMP/candidate\""
        },
        {
          "name": "Bind run identity",
          "env": {
            "RELEASE_VERSION": "${{ inputs.version }}",
            "RELEASE_SHA": "${{ inputs.source_sha }}"
          },
          "run": "make record-candidate CANDIDATE_DIR=\"$RUNNER_TEMP/candidate\""
        },
        {
          "name": "Upload candidate",
          "id": "upload",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "tusk-candidate-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/candidate/assets/*\n${{ runner.temp }}/candidate/candidate-run.json",
            "if-no-files-found": "error",
            "retention-days": 90,
            "compression-level": 0,
            "overwrite": false
          }
        }
      ],
      "needs": [
        "identity",
        "ci"
      ],
      "outputs": {
        "artifact_id": "${{ steps.upload.outputs.artifact-id }}",
        "artifact_digest": "${{ steps.upload.outputs.artifact-digest }}"
      }
    },
    "provenance": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Download exact build artifact",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "artifact-ids": "${{ needs.build.outputs.artifact_id }}",
            "path": "${{ runner.temp }}/candidate",
            "merge-multiple": true
          }
        },
        {
          "name": "Check downloaded payload set",
          "run": "make verify-release RELEASE_ASSETS=\"$RUNNER_TEMP/candidate/assets\"",
          "env": {
            "GOTOOLCHAIN": "go1.27.1"
          }
        },
        {
          "name": "Attest payloads and run identity",
          "uses": "actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a",
          "with": {
            "subject-path": "${{ runner.temp }}/candidate/assets/*\n${{ runner.temp }}/candidate/candidate-run.json",
            "push-to-registry": false
          }
        }
      ],
      "needs": [
        "build"
      ],
      "permissions": {
        "contents": "read",
        "actions": "read",
        "id-token": "write",
        "attestations": "write"
      }
    }
  }
}
