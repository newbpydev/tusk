{
  "name": "Native candidate verification",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "source_sha": {
          "description": "Full source SHA of the completed trusted candidate",
          "required": true,
          "type": "string"
        },
        "version": {
          "description": "Intended vMAJOR.MINOR.PATCH",
          "required": true,
          "type": "string"
        },
        "candidate_run_id": {
          "description": "Successful Release candidate run ID",
          "required": true,
          "type": "string"
        },
        "candidate_run_attempt": {
          "description": "Candidate run attempt",
          "required": true,
          "type": "string"
        },
        "manifest_sha256": {
          "description": "Maintainer-selected release manifest SHA256",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read",
    "attestations": "read"
  },
  "concurrency": {
    "group": "native-candidate-${{ github.run_id }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "native": {
      "name": "Packaged ${{ matrix.target }}",
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 30,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "runner": "ubuntu-24.04",
              "target": "linux/amd64"
            },
            {
              "runner": "ubuntu-24.04-arm",
              "target": "linux/arm64"
            },
            {
              "runner": "macos-15-intel",
              "target": "darwin/amd64"
            },
            {
              "runner": "macos-15",
              "target": "darwin/arm64"
            },
            {
              "runner": "windows-2025",
              "target": "windows/amd64"
            }
          ]
        }
      },
      "steps": [
        {
          "name": "Checkout frozen source",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ inputs.source_sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Verification compiler",
          "uses": "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff",
          "with": {
            "go-version": "1.27.1",
            "cache": true
          }
        },
        {
          "name": "Windows native Make",
          "if": "runner.os == 'Windows'",
          "run": "test -x /c/mingw64/bin/make.exe\nprintf '%s\\n' 'C:/mingw64/bin' >> \"$GITHUB_PATH\""
        },
        {
          "name": "Download selected candidate",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "tusk-candidate-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}",
            "path": "${{ runner.temp }}/candidate",
            "run-id": "${{ inputs.candidate_run_id }}",
            "github-token": "${{ github.token }}",
            "repository": "newbpydev/tusk"
          }
        },
        {
          "name": "Verify signatures then execute unchanged native payload",
          "run": "make native-candidate-smoke RELEASE_NATIVE_OUTPUT=\"$RUNNER_TEMP/native\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "GOTOOLCHAIN": "local",
            "CGO_ENABLED": "0",
            "CANDIDATE_DIR": "${{ runner.temp }}/candidate",
            "CANDIDATE_RUN_ID": "${{ inputs.candidate_run_id }}",
            "CANDIDATE_MANIFEST_SHA256": "${{ inputs.manifest_sha256 }}",
            "RELEASE_SHA": "${{ inputs.source_sha }}",
            "RELEASE_VERSION": "${{ inputs.version }}",
            "RELEASE_NATIVE_TARGET": "${{ matrix.target }}"
          }
        },
        {
          "name": "Retain every native report",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "native-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/native",
            "if-no-files-found": "warn",
            "retention-days": 90,
            "overwrite": false
          }
        }
      ]
    }
  }
}
